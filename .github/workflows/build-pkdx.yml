name: Build pkdx binaries

on:
  push:
    tags: ['v*']
  # Pre-merge validation path: maintainers can dispatch manually on a branch
  # to exercise the Windows MSVC/OpenBLAS toolchain before tagging a release.
  # The release job is gated to tag pushes so manual runs only build & test.
  workflow_dispatch:

permissions:
  contents: write
  # actions/cache saves the MoonBit toolchain under this token.
  actions: write

jobs:
  build:
    strategy:
      # Keep the legs independent. With fail-fast on, one failing OS cancels the
      # others before they report, which hides their state.
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired on 2026-11-02. macos-15 is the arm64 label
          # GitHub lists as its replacement.
          - os: macos-15
            target: darwin-arm64
            binary: pkdx-darwin-arm64
          - os: ubuntu-22.04
            target: linux-x86_64
            binary: pkdx-linux-x86_64
          - os: windows-2022
            target: windows-x86_64
            binary: pkdx-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MoonBit toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.moon
          # OS/arch plus the pinned moonc version (and its checksum list).
          # A cache hit still runs install_moon.sh, which checks `moonc -v`.
          key: moon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/moon-version', 'scripts/moon-sha256.txt') }}

      - name: Install MoonBit
        shell: bash
        run: |
          bash scripts/install_moon.sh
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi

      - name: Install BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Restore OpenBLAS install cache (Windows)
        # vcpkg builds OpenBLAS from source, which takes a while, so the installed
        # tree is cached on the pinned manifest and overlay port. save-always keeps
        # it even when a later step fails; vcpkg records a package as installed only
        # after its build succeeds, so a partial tree is never reported as complete.
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\blas\installed
          key: openblas-msvc-x64-windows-static-${{ hashFiles('scripts/windows-blas/**') }}
          save-always: true

      - name: Install OpenBLAS with LAPACK (Windows, MSVC static)
        # MSVC target: moon drives cl.exe and link.exe, and the runtime rejects
        # MinGW gcc, so OpenBLAS must be MSVC-format. The vcpkg overlay in
        # scripts/windows-blas builds OpenBLAS 0.3.34 with LAPACK (C_LAPACK=ON);
        # upstream vcpkg disables LAPACK, which numbt needs. The static x64-windows-static
        # triplet uses /MT, matching moon, so the release stays a single .exe.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install --triplet x64-windows-static `
            --overlay-ports=scripts/windows-blas/ports `
            --x-manifest-root=scripts/windows-blas `
            --x-install-root=C:\blas\installed
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install openblas failed (exit $LASTEXITCODE)" }
          $root = 'C:/blas/installed/x64-windows-static'
          if (-not (Test-Path "$root/lib/openblas.lib")) { throw "openblas.lib not found under $root" }
          if (-not ((Test-Path "$root/include/cblas.h") -or (Test-Path "$root/include/openblas/cblas.h"))) { throw "cblas.h not found under $root" }
          Get-ChildItem "$root/lib" | Format-Table Name, Length | Out-String | Write-Host
          # Exported for the Build and Test steps (configure_native_link_flags.sh).
          Add-Content -Path $env:GITHUB_ENV -Value "PKDX_OPENBLAS_ROOT=$root"

      - name: Build
        # moon_build_native.sh pins the post-update steps: migrate legacy
        # mooncakes manifests, rewrite native link flags, then moon build.
        run: bash scripts/moon_build_native.sh
        shell: bash

      - name: Test
        run: |
          bash scripts/configure_native_link_flags.sh
          moon test --target native
        shell: bash

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: cp _build/native/debug/build/src/main/main.exe ${{ matrix.binary }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "_build\native\debug\build\src\main\main.exe" "${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    # Only publish a release on tag pushes. Gate on event_name as well so a
    # manual workflow_dispatch on a tag ref (e.g. re-running an old release)
    # does not silently re-publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "pkdx ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/pkdx-darwin-arm64/pkdx-darwin-arm64 \
            artifacts/pkdx-linux-x86_64/pkdx-linux-x86_64 \
            artifacts/pkdx-windows-x86_64.exe/pkdx-windows-x86_64.exe
