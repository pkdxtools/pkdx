name: Build pkdx binaries

on:
  push:
    tags: ['v*']
  # Pre-merge validation path: maintainers can dispatch manually on a branch
  # to exercise the Windows MSYS2/OpenBLAS toolchain before tagging a release.
  # The release job is gated to tag pushes so manual runs only build & test.
  workflow_dispatch:

permissions:
  contents: write
  # actions/cache saves the MoonBit toolchain under this token.
  actions: write

jobs:
  build:
    strategy:
      # Keep the legs independent. With fail-fast on, one failing OS cancels the
      # others before they report, which hides their state.
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired on 2026-11-02. macos-15 is the arm64 label
          # GitHub lists as its replacement.
          - os: macos-15
            target: darwin-arm64
            binary: pkdx-darwin-arm64
          - os: ubuntu-22.04
            target: linux-x86_64
            binary: pkdx-linux-x86_64
          - os: windows-2022
            target: windows-x86_64
            binary: pkdx-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MoonBit toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.moon
          # OS/arch plus the pinned moonc version (and its checksum list).
          # A cache hit still runs install_moon.sh, which checks `moonc -v`.
          key: moon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/moon-version', 'scripts/moon-sha256.txt') }}

      - name: Install MoonBit
        shell: bash
        run: |
          bash scripts/install_moon.sh
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi

      - name: Install BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Install BLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use MSYS2's MinGW64 packages so OpenBLAS and gcc share the same ABI
          # without spending release CI time building OpenBLAS from source.

          # The default mirrorlist on the GitHub Actions Windows image rotates
          # through mirrors including tuna, which has timed out at ~0 B/sec
          # from Azure runners and aborted the release job mid-database-sync.
          # Pin to upstream + geographically diverse fallbacks (skipping tuna)
          # to make this step deterministic.
          Set-Content -Path C:\msys64\etc\pacman.d\mirrorlist.msys -Encoding ASCII -Value @'
          Server = https://repo.msys2.org/msys/$arch/
          Server = https://downloads.sourceforge.net/project/msys2/REPOS/MSYS2/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/msys/$arch/
          '@
          Set-Content -Path C:\msys64\etc\pacman.d\mirrorlist.mingw64 -Encoding ASCII -Value @'
          Server = https://repo.msys2.org/mingw/$repo/
          Server = https://downloads.sourceforge.net/project/msys2/REPOS/MINGW/$arch/
          Server = https://mirror.yandex.ru/mirrors/msys2/mingw/$repo/
          '@

          # Belt-and-braces: even with curated mirrors, a transient blip during
          # the multi-file sync can still abort pacman. Retry the whole call
          # before failing the job.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) {
              Write-Error "pacman failed after $maxAttempts attempts"
              exit 1
            }
            Write-Host "pacman attempt $attempt failed (exit $LASTEXITCODE); retrying in 10s..."
            Start-Sleep -Seconds 10
          }

          # Add OpenBLAS DLL dir to PATH for runtime resolution during moon test.
          Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      - name: Configure MoonBit compiler (Windows)
        # Both variables go to $GITHUB_ENV so the Build and Test steps see them.
        # This step is Windows-only, so Linux and macOS keep the default backend.
        #
        # MOONBIT_NEW_NATIVE=0 is required since moonc 0.10.18. Windows x86_64
        # otherwise gets direct-object output, which is compiled with the MSVC
        # toolchain only. That path ignores a non-cl MOON_CC with the warning
        # "MOON_CC is ignored for Windows MSVC direct object native target", so
        # cl.exe compiles src/db/cwrap.c and fails on <unistd.h>. With the
        # variable set to 0, moon emits generated C and compiles it, the runtime
        # and the C stubs with the MOON_CC driver.
        #
        # MOON_CC is the MSYS2 MinGW64 gcc that provides the OpenBLAS import
        # library (see the BLAS step above). The absolute path keeps resolution
        # independent of PATH state.
        #
        # Keep MOON_CC out of the Linux and macOS legs: MoonBit treats any
        # present MOON_CC as an explicit override and parses the value, so an
        # empty string fails with `failed to parse cc from env MOON_CC`.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "MOONBIT_NEW_NATIVE=0" >> "$GITHUB_ENV"
          echo "MOON_CC=C:/msys64/mingw64/bin/gcc.exe" >> "$GITHUB_ENV"

      - name: Build
        # moon_build_native.sh pins the post-update steps: migrate legacy
        # mooncakes manifests, rewrite native link flags, then moon build.
        run: bash scripts/moon_build_native.sh
        shell: bash

      - name: Test
        run: |
          bash scripts/configure_native_link_flags.sh
          moon test --target native
        shell: bash

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: cp _build/native/debug/build/src/main/main.exe ${{ matrix.binary }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "_build\native\debug\build\src\main\main.exe" "${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    # Only publish a release on tag pushes. Gate on event_name as well so a
    # manual workflow_dispatch on a tag ref (e.g. re-running an old release)
    # does not silently re-publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "pkdx ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/pkdx-darwin-arm64/pkdx-darwin-arm64 \
            artifacts/pkdx-linux-x86_64/pkdx-linux-x86_64 \
            artifacts/pkdx-windows-x86_64.exe/pkdx-windows-x86_64.exe
